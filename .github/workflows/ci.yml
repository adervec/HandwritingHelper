name: Test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

# House standard: nothing reaches the live site unless the checks passed.
# (Repo Settings -> Pages -> Source is "GitHub Actions".)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ponytail: no package.json — install the one dependency for this step only
      - run: npm i --no-save playwright-core@1.62.0
      - run: node --check sw.js
      - run: node selftest.mjs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: selftest
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # a fresh checkout, so nothing the test job installed is published
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  # House standards: check the live site after every deploy, then tag the release.
  after-deploy:
    needs: deploy
    uses: adervec/CoworkSyncHub/.github/workflows/after-deploy.yml@main
    with:
      url: https://adervec.github.io/HandwritingHelper/
    permissions:
      contents: write
