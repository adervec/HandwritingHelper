<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PDF RENDER RUNNING</title>
</head>
<body>
<pre id="out">running…</pre>
<script>
"use strict";
/* Checks the one part of the Drive import that needs the network: pdf.js loads
   from the CDN as a plain script, its worker loads cross-origin, and a page
   renders to a canvas with ink on it. Mirrors pdfPage() in index.html.
   Run: open this file, or headless with a remote-debugging port and read the title. */

// minimal valid PDF, offsets computed so pdf.js never falls back to xref recovery
function makePdf(pageTexts) {
  const objs = {};
  objs[3] = "<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>";
  const kids = [];
  pageTexts.forEach((txt, i) => {
    const pn = 4 + i * 2, cn = 5 + i * 2;
    kids.push(pn + " 0 R");
    objs[pn] = `<</Type/Page/Parent 2 0 R/MediaBox[0 0 612 792]/Resources<</Font<</F1 3 0 R>>>>/Contents ${cn} 0 R>>`;
    const stream = [700, 640, 580].map(y => `BT /F1 30 Tf 60 ${y} Td (${txt}) Tj ET`).join("\n");
    objs[cn] = `<</Length ${stream.length}>>\nstream\n${stream}\nendstream`;
  });
  objs[1] = "<</Type/Catalog/Pages 2 0 R>>";
  objs[2] = `<</Type/Pages/Kids[${kids.join(" ")}]/Count ${pageTexts.length}>>`;

  const nums = Object.keys(objs).map(Number).sort((a, b) => a - b);
  let pdf = "%PDF-1.4\n";
  const offset = {};
  for (const n of nums) { offset[n] = pdf.length; pdf += `${n} 0 obj\n${objs[n]}\nendobj\n`; }
  const xref = pdf.length;
  pdf += `xref\n0 ${nums.length + 1}\n0000000000 65535 f \n`;
  for (const n of nums) pdf += String(offset[n]).padStart(10, "0") + " 00000 n \n";
  pdf += `trailer\n<</Size ${nums.length + 1}/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF`;
  return new Uint8Array([...pdf].map(c => c.charCodeAt(0))).buffer;
}

function loadScript(src) {
  return new Promise((ok, no) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => no(new Error("load failed"));
    document.head.appendChild(s);
  });
}
async function pdfPage(buf, n) {
  if (!window.pdfjsLib) {
    await loadScript("https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js");
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
  }
  const pdf = await pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
  const page = await pdf.getPage(Math.min(n, pdf.numPages));
  const base = page.getViewport({ scale: 1 });
  const vp = page.getViewport({ scale: Math.min(3, 1600 / base.width) });
  const c = document.createElement("canvas");
  c.width = vp.width; c.height = vp.height;
  await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
  return { canvas: c, pages: pdf.numPages };
}

const out = [];
const check = (name, cond) => { out.push((cond ? "ok  " : "FAIL") + " " + name); return cond; };
(async () => {
  let pass = true;
  try {
    const buf = makePdf(["page one sample text", "page two sample text"]);
    const r1 = await pdfPage(buf, 1);
    pass = check("pdf.js loaded from CDN", !!window.pdfjsLib) && pass;
    pass = check("page count 2, got " + r1.pages, r1.pages === 2) && pass;
    pass = check("canvas ~1600px wide, got " + r1.canvas.width, r1.canvas.width > 1500 && r1.canvas.width <= 1600) && pass;
    const r2 = await pdfPage(buf, 2);
    const d = r2.canvas.getContext("2d").getImageData(0, 0, r2.canvas.width, r2.canvas.height).data;
    let dark = 0;
    for (let i = 0; i < d.length; i += 4) if (d[i] < 128 && d[i + 3] > 0) dark++;
    pass = check("page 2 rendered ink, dark px " + dark, dark > 500) && pass;
    // buffer reuse: rendering page 2 must not have consumed the original
    pass = check("source buffer still usable, bytes " + buf.byteLength, buf.byteLength > 0) && pass;
  } catch (e) { pass = check("threw — " + e.message, false); }
  document.title = pass ? "PDF RENDER PASS" : "PDF RENDER FAIL";
  document.getElementById("out").textContent = document.title + "\n" + out.join("\n");
})();
</script>
</body>
</html>
